name: Deploy Motion Room
on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - '.github/workflows/motion-room-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: motion-room-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: viewer
      - run: npm run check
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
        env:
          VIEWER_BASE_PATH: /GPT-motion-canvas/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy viewer
        id: deployment
        uses: actions/deploy-pages@v4
