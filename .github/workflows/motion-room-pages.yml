name: Deploy Motion Room
on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - '.github/workflows/motion-room-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: motion-room-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npm run check
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
        env:
          VIEWER_BASE_PATH: /GPT-motion-canvas/
      - name: Update the existing Pages branch
        shell: bash
        run: |
          git rm -f --ignore-unmatch ':(top,glob)*-*.js' ':(top,glob)*-*.css'
          cp -a viewer/dist/. .
          touch .nojekyll
          while IFS= read -r -d '' asset; do
            git add -- "${asset#viewer/dist/}"
          done < <(find viewer/dist -type f -print0)
          git add .nojekyll
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Deploy compiled Motion Room viewer [skip ci]'
            git push origin HEAD:main
          fi
      - name: Request the configured GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
